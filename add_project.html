<style>

body{
background: linear-gradient(to right,#4facfe,#00f2fe);
min-height:100vh;
font-family: Arial, sans-serif;
padding:40px;
}

.form-box{
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
max-width:600px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
}

input, textarea{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
margin-top:5px;
}

textarea{
height:120px;
resize:none;
}

button{
padding:10px 20px;
background:#28a745;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#218838;
}

</style>


<div class="form-box">

<h1>Add Project</h1>

<form method="POST">

Title<br>
<input type="text" name="title"><br><br>

Start Month<br>
<input type="text" name="start_month"><br><br>

End Month<br>
<input type="text" name="end_month"><br><br>

Description<br>
<textarea name="description"></textarea><br><br>

Project Link<br>
<input type="text" name="link"><br><br>

<button type="submit">Add Project</button>

</form>

</div>
