<style>

body{
background: linear-gradient(to right,#4facfe,#00f2fe);
min-height:100vh;
font-family: Arial, sans-serif;
padding:40px;
}

.dashboard-box{
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
max-width:1100px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#f2f2f2;
padding:10px;
}

td{
padding:10px;
}

table, th, td{
border:1px solid #ddd;
}

tr:nth-child(even){
background:#f9f9f9;
}

a{
text-decoration:none;
margin-right:6px;
}

.resume-link{
color:#007bff;
}

.shortlist{
color:#f39c12;
font-weight:bold;
}

.select{
color:#28a745;
font-weight:bold;
}

.reject{
color:#dc3545;
font-weight:bold;
}

</style>


<div class="dashboard-box">

<h1>Applicants for {{ job.title }}</h1>

<table border="1">

<tr>
<th>Student ID</th>
<th>Student Name</th>
<th>Email</th>
<th>Skills</th>
<th>Resume</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for app in applications %}

<tr>
<td>{{ app.student.id }}</td>
<td>{{ app.student.name }}</td>
<td>{{ app.student.email }}</td>
<td>{{ app.student.skills }}</td>

<td>
<a class="resume-link" href="/static/resumes/{{ app.student.resume }}">View Resume</a>
</td>

<td>{{ app.status }}</td>

<td>

<a class="shortlist" href="/shortlist/{{ app.id }}">Shortlist</a> |

<a class="select" href="/select/{{ app.id }}">Select</a> |

<a class="reject" href="/reject/{{ app.id }}">Reject</a>

</td>

</tr>

{% endfor %}

</table>

</div>
